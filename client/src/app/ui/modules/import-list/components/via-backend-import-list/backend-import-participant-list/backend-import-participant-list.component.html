<mat-card class="os-card import-table spacer-bottom-60">
    <mat-card-content>
        <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; width: auto">
            <div style="display: flex; flex-direction: column">
                <h3 class="instructions">{{ 'Example (template)' | translate }}</h3>
                <div>
                    <input
                        #fileInput
                        accept="text"
                        class="hidden-input"
                        id="user-import-file-input"
                        tabindex="0"
                        type="file"
                        [aria-label]="'Import csv template' | translate"
                        (change)="onSelectedFile($event)"
                        (keydown.enter)="downloadCsvExample()"
                        (keydown.space)="downloadCsvExample(); $event.preventDefault()"
                    />
                    <button
                        class="outlined-border"
                        matButton
                        outlined
                        [aria-label]="'Information' | translate"
                        (click)="downloadCsvExample()"
                        (keydown.enter)="downloadCsvExample()"
                        (keydown.space)="downloadCsvExample(); $event.preventDefault()"
                    >
                        <mat-icon>download</mat-icon>
                        <mat-label>CSV</mat-label>
                    </button>
                </div>
            </div>
            <div style="display: flex; flex-direction: column">
                <h3 class="instructions">{{ 'Description of columns' | translate }}</h3>
                <div>
                    <button class="outlined-border" matButton outlined (click)="openDialog()">
                        <mat-icon color="accent">info</mat-icon>
                        <mat-label>{{ 'INFO' | translate }}</mat-label>
                    </button>
                </div>
                <span class="descriptionColumns" [innerHTML]="columnsInformation | trust: 'html'"></span>
            </div>
            <div style="display: flex; flex-direction: column">
                <h3 class="instructions">{{ 'Instructions for import file' | translate }}</h3>
                <span [innerHTML]="instructionsForImport | trust: 'html'"></span>
            </div>
        </div>
    </mat-card-content>
</mat-card>
<mat-card class="os-card import-table spacer-bottom-60">
    <mat-card-content>
        <!-- DROPZONE START -->
        <div
            aria-label="Drag files to this area or click here to select files"
            class="dropdiv"
            role="button"
            tabindex="0"
            (click)="fileInput.click()"
            (dragover)="onDragOver($event)"
            (drop)="onDropSuccess($event)"
            (keydown.enter)="fileInput.click()"
            (keydown.space)="fileInput.click(); $event.preventDefault()"
        >
            <mat-label class="dropdiv-label" for="fileInput">
                {{ 'Drag files to this area OR click here to select files' | translate }}
            </mat-label>
        </div>
        <!-- DROPZONE END -->
        @if (!finishedSuccessfully && (rawFileObservable | async); as file) {
            <div class="import-file-handle">
                {{ file.name }}
                <button mat-icon-button (click)="removeSelectedFile()">
                    <mat-icon>close</mat-icon>
                </button>
            </div>
        }
        <!-- Preview button -->
        <button
            class="outlined-border"
            matButton
            outlined
            routerLink="/participants/import/preview"
            routerLinkActive="active"
            [disabled]="uploadButton"
            (click)="showPreview()"
        >
            {{ 'Select file' | translate }}
        </button>
    </mat-card-content>
</mat-card>
