<h1 mat-dialog-title>{{ 'Insert/edit link' | translate }}</h1>
<div mat-dialog-content>
    <div>
        <mat-form-field>
            <mat-label>{{ 'Source' | translate }}</mat-label>
            <input matInput [(ngModel)]="image.src" />
        </mat-form-field>
    </div>

    <div>
        <mat-form-field>
            <mat-label>{{ 'Title' | translate }}</mat-label>
            <input matInput [(ngModel)]="image.title" />
        </mat-form-field>
    </div>

    <div>
        <mat-form-field>
            <mat-label>{{ 'Image description' | translate }}</mat-label>
            <input matInput [(ngModel)]="image.alt" />
        </mat-form-field>
    </div>
</div>
<div mat-dialog-actions>
    <button color="accent" mat-button translate [disabled]="!image.src" (click)="save()">Ok</button>
    <button mat-button translate (click)="cancel()">Cancel</button>
</div>
