<div class="vote-container" [class.has-option]="poll().options?.length === 1">
    @if (poll().options?.length === 1) {
        <div class="vote-option-title" role="rowheader">
            <os-poll-vote-option [option]="poll().options[0]" />
        </div>
    }
    @for (action of voteActions(); track action.vote) {
        <div class="vote-button-area" role="gridcell">
            <os-poll-vote-button
                [disabled]="loading()"
                [isSelected]="isOptionSelected(action.vote)"
                [optionTitle]="action.label | translate"
                [optionType]="action.vote"
                (toggleOption)="submitVote(action.vote)"
            />
            <span aria-hidden="true" class="vote-label">
                {{ action.label | translate }}
            </span>
        </div>
    }
</div>
