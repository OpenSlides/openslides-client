@if (!disableRunning()) {
    @for (poll of polls(); track poll.id) {
        <ng-container [ngTemplateOutlet]="pollArea" [ngTemplateOutletContext]="{ poll: poll, last: false }" />
    }
}
@if (
    lastPublishedPoll.hasValue() &&
    lastPublishedPoll.value() &&
    !hasProjectedModelOpenPolls.value() &&
    !disableFinished()
) {
    <ng-container
        [ngTemplateOutlet]="pollArea"
        [ngTemplateOutletContext]="{ poll: lastPublishedPoll.value(), last: true }"
    />
}

<ng-template #pollArea let-last="last" let-poll="poll">
    <mat-card class="os-card">
        <mat-card-content>
            <os-autopilot-poll [poll]="poll" />
        </mat-card-content>
    </mat-card>
</ng-template>
