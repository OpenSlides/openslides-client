@if (showPoll()) {
    <mat-card class="motion-poll-wrapper">
        <mat-card-content>
            <os-poll
                navigateTo="poll"
                [allowEdit]="true"
                [poll]="poll()"
                (dialogOpened)="dialogOpened.emit($event)"
            ></os-poll>
        </mat-card-content>
    </mat-card>
}
