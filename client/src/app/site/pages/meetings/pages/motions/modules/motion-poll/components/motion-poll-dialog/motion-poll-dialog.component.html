<mat-dialog-content>
    <div class="poll-config">
        <os-poll-form
            [customConfigForm]="true"
            [data]="pollData"
            [isEVotingEnabled]="isEVotingEnabled"
            [pollSettings]="pollSettings | async"
        >
            <os-poll-form-approval [formData]="pollData" [initialData]="pollData" [settings]="pollSettings | async" />
        </os-poll-form>
    </div>

    @if (isAnalogPoll()) {
        <div class="poll-result">
            <os-poll-edit-result
                configType="approval"
                [options]="analogPollOptions()"
                [pollConfigData]="approvalFormValue"
                [pollData]="currentPollData"
            />
        </div>
    }
</mat-dialog-content>

<mat-dialog-actions>
    <div class="dialog-actions">
        <div>
            <button mat-button [disabled]="!formsValid() && !approvalFormValid()" (click)="submitPoll()">
                <span>{{ 'Save' | translate }}</span>
            </button>

            <button mat-button [mat-dialog-close]="false">
                <span>{{ 'Cancel' | translate }}</span>
            </button>
        </div>
    </div>
</mat-dialog-actions>
