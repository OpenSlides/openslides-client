<mat-dialog-content>
    <div class="poll-config" [class.hidden]="analogPollFormOpen()">
        <os-poll-form [customConfigForm]="true" [data]="pollData" [isEVotingEnabled]="isEVotingEnabled">
            <os-poll-form-approval [data]="pollData" />
        </os-poll-form>
    </div>

    @if (analogPollFormOpen()) {
        <div class="poll-result">
            <os-poll-edit-result
                configType="approval"
                [options]="analogPollOptions()"
                [pollConfigData]="approvalFormValue"
                [pollData]="currentPollData"
            />
        </div>
    }
</mat-dialog-content>

<mat-dialog-actions>
    <div class="dialog-actions">
        <div>
            <button mat-button [disabled]="!formsValid() && !approvalFormValid()" (click)="submitPoll()">
                <span>{{ 'Save' | translate }}</span>
            </button>

            <button mat-button [mat-dialog-close]="false">
                <span>{{ 'Cancel' | translate }}</span>
            </button>
        </div>

        <div>
            @if (isAnalogPoll()) {
                @if (analogPollFormOpen()) {
                    <button mat-button (click)="toggleAnalogPollForm()">
                        <span>{{ 'Edit Poll' | translate }}</span>
                    </button>
                } @else {
                    <button mat-button (click)="toggleAnalogPollForm()">
                        <span>{{ 'Edit Result' | translate }}</span>
                    </button>
                }
            }
        </div>
    </div>
</mat-dialog-actions>
