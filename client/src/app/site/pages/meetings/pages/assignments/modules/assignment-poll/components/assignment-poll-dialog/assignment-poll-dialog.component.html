<mat-dialog-content>
    <div class="poll-config">
        <os-poll-form
            optionType="meeting_user"
            [data]="pollData"
            [isEVotingEnabled]="isEVotingEnabled"
            [optionAmount]="optionAmount"
            [pollSettings]="pollSettings | async"
        ></os-poll-form>
    </div>

    @if (isAnalogPoll() && pollForm().methodConfig()) {
        <div class="poll-result">
            <os-poll-edit-result
                [configType]="pollForm().selectedMethod()"
                [options]="analogPollOptions()"
                [pollConfigData]="pollForm().methodConfig()"
                [pollData]="currentPollData"
            />
        </div>
    }
</mat-dialog-content>

<!-- Actions -->
<mat-dialog-actions>
    <div class="dialog-actions">
        <div>
            <button mat-button [disabled]="!formsValid()" (click)="submitPoll()">
                <span>{{ 'Save' | translate }}</span>
            </button>

            <button mat-button [mat-dialog-close]="false">
                <span>{{ 'Cancel' | translate }}</span>
            </button>
        </div>
    </div>
</mat-dialog-actions>
