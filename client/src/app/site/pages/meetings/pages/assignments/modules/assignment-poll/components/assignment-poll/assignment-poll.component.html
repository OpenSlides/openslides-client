@if (showPoll()) {
    <mat-card class="os-card">
        <mat-card-content>
            <os-poll
                navigateTo="poll"
                [allowEdit]="true"
                [poll]="poll.value()"
                (dialogOpened)="dialogOpened.emit($event)"
            />
        </mat-card-content>
    </mat-card>
}
