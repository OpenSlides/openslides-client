<h2 class="dialog-title" mat-dialog-title>
    @if (data.isMultiSelect) {
        {{ 'Move all selected items to agenda' | translate }}
    } @else {
        {{ data.title + ': ' + 'Move to agenda' | translate }}
    }
</h2>
<mat-dialog-content class="dialog-content padding-top">
    <form class="agenda-add-form" [formGroup]="toAgendaForm">
        <div>
            <mat-form-field class="padding-top form-field">
                <mat-label id="agenda_visibility">{{ 'Agenda visibility' | translate }}</mat-label>
                <mat-select aria-labelledby="agenda_visibility" formControlName="agenda_type" required>
                    @for (type of visibilityChoices; track type) {
                        <mat-option [value]="type.key">
                            {{ type.name }}
                        </mat-option>
                    }
                </mat-select>
            </mat-form-field>
        </div>
        <div>
            <mat-form-field class="form-field">
                <mat-label id="agenda_parent">{{ 'Parent agenda item' | translate }}</mat-label>
                <os-list-search-selector
                    aria-labelledby="agenda_parent"
                    formControlName="agenda_parent_id"
                    [includeNone]="true"
                    [inputListValues]="parentObserver"
                ></os-list-search-selector>
            </mat-form-field>
        </div>
    </form>
</mat-dialog-content>

<mat-dialog-actions class="text-align-end">
    <button color="primary" mat-button type="button" (click)="addToAgenda()">
        {{ 'Move to agenda' | translate }}
    </button>
    <button mat-button type="button" (click)="dialogRef.close()">{{ 'Cancel' | translate }}</button>
</mat-dialog-actions>
